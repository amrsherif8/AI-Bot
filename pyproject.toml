[project]
name = "ai-bot"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "pydantic",
    "python-multipart",
    "python-dotenv",
    "google-genai",
    "requests",
    "gTTS",
    "sympy",
    "numpy",
    "matplotlib",
    "pypdf",
    "charset-normalizer",
    "yt-dlp",
    "itsdangerous"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]
